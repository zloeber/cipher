# System prompt - User customizable
# This prompt will be combined with built-in tool usage instructions
systemPrompt:
  enabled: true
  content: |
    You are a highly intelligent and capable AI game master, specializing in managing interactive novel campaigns.
    - Tracking all interactions
    - Building compelling narratives
    - Managing game mechanics, levels, character choices, and world states

memoryProfile:
  name: game_master
  description: Game master profile for managing interactive novel campaigns, tracking all interactions, levels, character choices, and world states.
  prompts:
  system: |-
    You analyze and retain all significant game-related knowledge, including player interactions, choices, level progress, character stats, world states, 
    and narrative events for an epic interactive novel campaign.

    Process all content relevant to the campaign, including dialogue, decisions, outcomes, inventory, quests, and world changes. 
    Skip only trivial or non-game-related content.

    Consider:
    1) Narrative and gameplay relevance
    2) Semantic similarity/overlap with existing memories
    3) Recency and contextual relevance
    4) Quality and completeness of the event or choice
    5) Conversation context and campaign continuity
    6) Concrete details about characters, worlds, and story progression

    Rules:
    - ADD: New, unique game event, choice, or state
    - UPDATE: Improves/corrects existing campaign knowledge
    - DELETE: Outdated/incorrect/contradictory information
    - NONE: Duplicate, already covered, or non-significant

    Always preserve full narrative blocks, choices, and game state details exactly as given.
  tools:
    extract_knowledge:
      description: Extract detailed campaign knowledge, including interactions, choices, level progress, character stats, world states, and narrative events.
      parameters:
        knowledge: An array of strings, each containing a campaign event, choice, or state, with complete narrative or data blocks within triple backticks if present.
  skipPatterns:
    # Non-game-related or trivial content
    - pattern: "\\b(hello|hi|hey|thanks|thank you|please|sorry|bye|goodbye)\\b"
      flags: "i"
    - pattern: "\\b(personal|profile|identity|username|login|password|email|address|phone)\\b"
      flags: "i"
    - pattern: "^\\s*$"  # Empty or whitespace-only
    # Any user command (ie. \help, \reset, \stats)
    - pattern: "^\\\\[\\w\\d_-]+\\b"
      flags: "i"
    # Simple affirmations and negations
    - pattern: "^(yes|no|ok|okay|sure|fine|great|good|right|correct|wrong|true|false)\\s*[.!?]?\\s*$"
      flags: "i"
    - pattern: "^(task completed|operation successful|processing|loading|waiting|done|finished|ready)\\b"
      flags: "i"
    - pattern: "^(cipher_memory_search|memory_search):\\s*(found|completed|no results|error)\\b"
      flags: "i"
    - pattern: "^(task|operation|process):\\s*(completed|failed|in progress|waiting|canceled)\\b"
      flags: "i"
  keyPatterns:
    # Game and narrative elements
    - pattern: "\\b(character|player|npc|level|quest|mission|objective|goal|choice|decision|action|inventory|item|skill|ability|stat|attribute|xp|experience|level up|progress|checkpoint|save|load|world|map|location|area|region|kingdom|realm|campaign|story|plot|event|encounter|battle|combat|dialogue|conversation|scene|chapter|turn|round|roll|dice|outcome|result|reward|penalty|challenge|puzzle|trap|secret|lore|history|timeline|timeline event|artifact|magic|spell|power|enemy|monster|boss|villain|hero|party|team|faction|alliance|guild|order|epic|legend|myth|prophecy|destiny|fate|timeline|timeline event)\\b"
      flags: "i"
    # Narrative and code blocks
    - pattern: "```[\\s\\S]*```"
    - pattern: "`[^`]+`"
    # Game mechanics and stats
    - pattern: "\\b(hp|mp|ap|sp|strength|dexterity|intelligence|wisdom|charisma|constitution|luck|armor|weapon|damage|heal|buff|debuff|effect|status|turn|initiative|roll|d20|d6|d10|d12|d8|d4)\\b"
      flags: "i"
    # Choices and branching
    - pattern: "\\b(option|choose|select|pick|branch|path|route|fork|outcome|result|consequence|alternative|variant)\\b"
      flags: "i"
    # World and environment
    - pattern: "\\b(environment|weather|season|time|day|night|sunrise|sunset|moon|star|terrain|forest|mountain|river|lake|sea|ocean|desert|cave|dungeon|castle|village|city|town|market|inn|tavern|temple|ruin|fortress|tower|portal|dimension|plane|universe|multiverse)\\b"
      flags: "i"
  commonPatterns: []
    # Brackets and parentheses
    # - pattern: "[{}\\[\\]()]"
    # # Operators and punctuation
    # - pattern: "[=><!&|]"
    # - pattern: "[;:,]"
    # # Dot notation and function calls
    # - pattern: "\\w+\\.\\w+"
    # - pattern: "\\w+\\(\\)"
    # # Dice notation
    # - pattern: "\\bd\\d+\\b"
    # # Comments
    # - pattern: "/\\*[\\s\\S]*?\\*/|//.*$"
    #   flags: "m"
