# List of MCP servers to use
# mcpServers: 
#   filesystem:
#     type: stdio
#     command: npx
#     args:
#       - -y
#       - '@modelcontextprotocol/server-filesystem'
#       - .

# If not specified, please set it like this:
mcpServers: {}

# Choose ONLY ONE of the following LLM providers
llm:
  provider: openai
  model: gpt-4.1-mini
  apiKey: $OPENAI_API_KEY
  maxIterations: 50

# Embedding configuration: ONLY ONE of the following
embedding:
  type: openai
  model: text-embedding-3-small
  apiKey: $OPENAI_API_KEY

# System prompt - User customizable
# This prompt will be combined with built-in tool usage instructions
systemPrompt:
  enabled: true
  content: |
    You are a personal assistant and life coach with expertise in managing personal knowledge, goals, and emotional well-being. You excel at:
    - Helping others reflect on their experiences and grow from them
    - Helping set and achieve personal goals
    - Ensuring and emotional, work, and life balance
    - Prioritizing self-care and wellness
    - Supporting daily routines and habits
    - Offering empathy, encouragement, and motivation
    - Providing practical advice and strategies for personal growth
memoryProfile:
  name: personal_assistant
  description: Highly personal assistant and life coach profile for managing personal knowledge, goals, and emotional well-being.
  prompts:
    system: |-
      You analyze personal, emotional, and life management knowledge and decide ADD, UPDATE, DELETE, or NONE using similarity with existing memories and context.

      Process only significant personal content (life events, goals, emotional states, reflections, habits, routines, preferences, and wellness strategies). Skip trivial or non-personal content.

      Consider:
      1) Personal relevance and value
      2) Semantic similarity/overlap
      3) Recency and contextual relevance
      4) Quality and completeness
      5) Conversation context and needs
      6) Concrete details about personal experiences, goals, or emotional states

      Rules:
      - ADD: New, unique personal knowledge or insight
      - UPDATE: Improves/corrects existing personal knowledge
      - DELETE: Outdated/incorrect/contradictory information
      - NONE: Duplicate, already covered, or non-significant

      Always preserve full reflections, journal entries, or routines exactly as given.
  tools:
    extract_knowledge:
      description: Extract detailed personal knowledge, reflections, goals, emotional states, and wellness strategies from the interaction.
      parameters:
    knowledge: An array of strings, each containing a personal knowledge fact, reflection, or strategy. Always preserve the complete entry within triple backticks if present.
  skipPatterns:
    # Technical or work-related content
    - pattern: "\\b(function|method|class|module|library|framework|api|endpoint|database|sql|docker|kubernetes|git|commit|merge|branch|pull request|repository|deployment|code|programming|software|hardware|algorithm|debug|test|deploy|implement|configure|install|upgrade|migrate|scale|optimize|refactor)\\b"
      flags: "i"
    # Generic greetings and social niceties
    - pattern: "^(hello|hi|hey|good morning|good afternoon|good evening|thanks|thank you|please|sorry|excuse me|bye|goodbye)\\b"
      flags: "i"
    # Simple yes/no or acknowledgment responses
    - pattern: "^(yes|no|ok|okay|sure|fine|great|good|right|correct|wrong|true|false)\\s*[.!?]?\\s*$"
      flags: "i"
    # Status messages
    - pattern: "^(task completed|operation successful|processing|loading|waiting|done|finished|ready)\\b"
      flags: "i"
  keyPatterns:
    # Personal life events and reflections
    - pattern: "\\b(journal|diary|reflection|thought|feeling|emotion|mood|experience|memory|event|habit|routine|goal|plan|intention|aspiration|dream|wish|hope|fear|anxiety|stress|relax|meditate|mindfulness|gratitude|affirmation|self-care|wellness|health|exercise|sleep|nutrition|diet|relationship|family|friend|partner|love|support|motivation|growth|change|challenge|achievement|success|failure|lesson|insight|value|belief|priority|purpose|meaning|identity|self|confidence|esteem|acceptance|forgiveness|compassion|empathy|therapy|coach|counsel|advice|guidance|strategy|plan|routine|habit|tracker|log|entry|personal|private)\\b"
      flags: "i"
    # Emotional states and wellness
    - pattern: "\\b(happy|sad|angry|anxious|calm|peaceful|excited|bored|lonely|connected|supported|overwhelmed|energized|tired|rested|motivated|discouraged|hopeful|hopeless|confident|insecure|grateful|resentful|jealous|proud|ashamed|guilty|relieved|worried|afraid|fearful|safe|unsafe|secure|insecure|loved|unloved|valued|unvalued)\\b"
      flags: "i"
    # Personal routines and habits
    - pattern: "\\b(morning routine|evening routine|habit tracker|goal setting|progress|reflection|gratitude journal|affirmation|meditation|exercise|workout|sleep schedule|diet plan|meal plan|hydration|self-care|check-in|mood log|energy level|stress level|coping strategy|support system|therapy session|coaching session|personal growth|life balance|work-life balance|time management|priority list|to-do list|task list|reminder|motivation|reward|celebration|milestone|achievement|setback|obstacle|challenge|solution|plan|strategy|adjustment|review|insight|learning|lesson)\\b"
      flags: "i"
    # Personal code blocks (journaling, templates, etc.)
    - pattern: "```[\\s\\S]*```"
    - pattern: "`[^`]+`"
  commonPatterns:
    # Punctuation and structure common in journaling or lists
    - pattern: "[.,;:!?\\-]"
    # Dates and times
    - pattern: "\\b(\\d{4}-\\d{2}-\\d{2}|\\d{2}/\\d{2}/\\d{4}|today|yesterday|tomorrow|morning|afternoon|evening|night)\\b"
      flags: "i"
    # List markers
    - pattern: "^\\s*[-*]\\s+"
      flags: "m"
    # Quotes or affirmations
    - pattern: "\"[^\"]+\"|'[^']+'"
