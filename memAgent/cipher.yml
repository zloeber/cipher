# System prompt - User customizable
# This prompt will be combined with built-in tool usage instructions
systemPrompt:
  enabled: true
  content: |
    You are an AI programming assistant focused on coding and reasoning tasks. You excel at:
    - Writing clean, efficient code
    - Debugging and problem-solving
    - Code review and optimization
    - Explaining complex technical concepts
    - Reasoning through programming challenges
memoryProfile:
  assigned: default
  profiles:
    - name: default
      description: Default memory profile for general programming knowledge and decision retention.
      prompts:
        system: |-
          You analyze programming knowledge facts and decide ADD, UPDATE, DELETE, or NONE using similarity with existing memories and context.

          Process only significant technical content (concepts, code details, patterns, implementations). Skip personal or trivial content.

          Consider:
          1) Technical relevance and value
          2) Semantic similarity/overlap
          3) Recency and contextual relevance
          4) Quality and completeness
          5) Conversation context and needs
          6) Concrete code/pattern details

          Rules:
          - ADD: New, unique technical knowledge
          - UPDATE: Improves/corrects existing technical knowledge
          - DELETE: Outdated/incorrect/contradictory information
          - NONE: Duplicate, already covered, or non-significant

          Always preserve full code blocks/commands/patterns exactly as given.
      tools:
        extract_knowledge:
          description: Extract detailed knowledge with implementation code, commands, and technical details from the interaction.
          parameters:
            knowledge: An array of strings, each containing a programming knowledge along with complete implementation code, command syntax, or technical details when present. Always preserve the complete pattern within triple backticks.
      skipPatterns:
        # Personal information and identity
        - pattern: "\\b(my name|user['']?s? name|find my name|search.*name|who am i|what['']?s my name)\\b"
          flags: "i"
        - pattern: "\\b(personal|profile|identity|username|login|password|email|address|phone)\\b"
          flags: "i"
        # Trivial search queries without technical context
        - pattern: "^(user:|assistant:)?\\s*(search|find|look|what|where|who|when|why|how)\\s+(is|are|was|were|do|does|did|can|could|should|would|will|my|the|a|an)\\b"
          flags: "i"
        # Simple greetings and social interactions
        - pattern: "^(user:|assistant:)?\\s*(hello|hi|hey|good morning|good afternoon|good evening|thanks|thank you|please|sorry|excuse me|bye|goodbye)\\b"
          flags: "i"
        # Tool results with no meaningful content
        - pattern: "^(cipher_memory_search|memory_search):\\s*(found|completed|no results|error)"
          flags: "i"
        # Generic status messages
        - pattern: "^(task completed|operation successful|processing|loading|waiting|done|finished|ready)\\b"
          flags: "i"
        # Simple yes/no or acknowledgment responses
        - pattern: "^(user:|assistant:)?\\s*(yes|no|ok|okay|sure|fine|great|good|right|correct|wrong|true|false)\\s*[.!?]?\\s*$"
          flags: "i"
      # If any of these match at all the knowledge is considered significant
      keyPatterns:
        # Programming concepts and patterns
        - pattern: "\\b(function|method|class|interface|module|library|framework|algorithm|data structure|design pattern)\\b"
          flags: "i"
        - pattern: "\\b(variable|constant|parameter|argument|return|async|await|promise|callback|closure|scope)\\b"
          flags: "i"
        - pattern: "\\b(loop|iteration|recursion|condition|exception|error handling|debugging|testing|optimization)\\b"
          flags: "i"

        # Code elements and syntax
        - pattern: "\\b(import|export|require|include|package|dependency|api|endpoint|request|response)\\b"
          flags: "i"
        - pattern: "\\b(database|query|sql|nosql|schema|table|index|transaction|orm|migration)\\b"
          flags: "i"
        - pattern: "\\b(git|version control|commit|merge|branch|pull request|repository|deployment)\\b"
          flags: "i"

        # Technical implementations
        - pattern: "\\b(implements?|extends?|inherits?|overrides?|polymorphism|encapsulation|abstraction)\\b"
          flags: "i"
        - pattern: "\\b(sort|search|filter|map|reduce|transform|parse|serialize|encrypt|decrypt)\\b"
          flags: "i"
        - pattern: "\\b(authentication|authorization|security|validation|sanitization|middleware)\\b"
          flags: "i"

        # Code blocks and technical syntax
        - pattern: "```[\\s\\S]*```"
        - pattern: "`[^`]+`"
        - pattern: "\\$[a-zA-Z_][a-zA-Z0-9_]*"   # Shell variables
        - pattern: "\\b(npm|yarn|pip|composer|cargo|go get|mvn|gradle)\\b"
          flags: "i"

        # File and system operations
        - pattern: "\\b(file|directory|path|config|environment|server|client|host|port|url|http|https|ssl|tls)\\b"
          flags: "i"
        - pattern: "\\b(dockerfile|docker|container|kubernetes|cloud|aws|azure|gcp|ci/cd|pipeline)\\b"
          flags: "i"

        # Programming languages and technologies
        - pattern: "\\b(javascript|typescript|python|java|c\\+\\+|c#|rust|go|php|ruby|swift|kotlin|scala|r)\\b"
          flags: "i"
        - pattern: "\\b(react|vue|angular|node|express|django|flask|spring|rails|laravel|fastapi)\\b"
          flags: "i"
        - pattern: "\\b(html|css|scss|sass|less|bootstrap|tailwind|webpack|vite|rollup|babel|eslint)\\b"
          flags: "i"

        # Error messages and stack traces with technical context
        - pattern: "\\b(error|exception|traceback|stack trace|compilation|syntax error|runtime error|type error)\\b"
          flags: "i"

        # Technical explanations and problem-solving
        - pattern: "\\b(solution|approach|implementation|technique|strategy|pattern|best practice|optimization)\\b"
          flags: "i"
        - pattern: "\\b(performance|scalability|maintainability|refactoring|code review|documentation)\\b"
          flags: "i"

        # Programming-specific patterns that indicate technical content
        - pattern: "\\b(code|coding|program|programming|develop|development|software|hardware|tech|technical|digital|computer|computing|algorithm|logic|syntax|semantic|compile|runtime|execute|debug|test|deploy|implement|configure|setup|install|upgrade|migrate|scale|optimize|refactor)\\b"
          flags: "i"

      # If 2 or more of these patterns match, the knowledge is considered significant
      commonPatterns:
        # Brackets and parentheses
        - pattern: "[{}\\[\\]()]"
        # Operators
        - pattern: "[=><!&|]"
        # Punctuation common in code
        - pattern: "[;:,]"
        # Dot notation
        - pattern: "\\w+\\.\\w+"
        # Function calls
        - pattern: "\\w+\\(\\)"
        # Comments
        - pattern: "/\\*[\\s\\S]*?\\*/|//.*$"
          flags: "m"

      # If > 10% of words match, the knowledge is considered significant
      wordPatterns:
        - api
        - sdk
        - cli
        - gui
        - ui
        - ux
