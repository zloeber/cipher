  postgres:
    image: postgres
    restart: unless-stopped
    container_name: postgres
    environment:
      POSTGRES_USER: ${PG_ADMIN:-admin}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-secret}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  postgres-init:
    image: postgres:latest
    container_name: postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_ADMIN: ${PG_ADMIN:-admin}
      PGPASSWORD: ${PG_PASSWORD:-secret}
      #CIPHER_PG_ADMIN: ${CIPHER_PG_ADMIN:-cipher}
      #CIPHER_PG_PASSWORD: ${CIPHER_PG_PASSWORD:-secret_cipher}
      CIPHER_PG_ADMIN: ${PG_ADMIN:-admin}
      CIPHER_PG_PASSWORD: ${PG_PASSWORD:-secret}
      POSTGRES_DB: cipher_db
    # volumes:
    #   - ./init-scripts:/docker-entrypoint-initdb.d:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        #!/bin/sh
        sleep 5
        psql -h postgres -U "${PG_ADMIN:-admin}" -tc "SELECT 1 FROM pg_database WHERE datname = 'cipher_db'" | grep -q 1 || psql -h postgres -U "${PG_ADMIN:-admin}" -c "CREATE DATABASE cipher_db;"
        # Optionally create user and grant privileges if needed
        psql -h postgres -U "${PG_ADMIN:-admin}" -c "CREATE USER cipher_user WITH PASSWORD 'secret_cipher';" || echo 'User already exists'
        psql -h postgres -U "${PG_ADMIN:-admin}" -c "GRANT ALL PRIVILEGES ON DATABASE cipher_db TO cipher_user;" || echo 'Failed to grant privileges'
        psql -h postgres -U "${PG_ADMIN:-admin}" -c "GRANT USAGE, CREATE ON SCHEMA public TO cipher_user;" || echo 'Failed to grant schema privileges'
        psql -h postgres -U "${PG_ADMIN:-admin}" -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO cipher_user;" || echo 'Failed to grant table privileges'
        psql -h postgres -U "${PG_ADMIN:-admin}" -c "GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO cipher_user;" || echo 'Failed to grant sequence privileges'
    restart: "no"

  pgweb:
    container_name: pgweb
    image: sosedoff/pgweb:latest
    environment:
      PGWEB_DATABASE_URL: postgres://${PG_ADMIN:-admin}:${PG_PASSWORD:-secret}@postgres:5432/cipher_db?sslmode=disable
    ports:
      - 8081:8081
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-vz", "127.0.0.1", "8081"]
      interval: 5s

