configs:
  qdrant_config:
    content: |
      log_level: INFO
  cipher_config:
    content: |
      mcpServers: {}

      # Choose ONLY ONE of the following LLM providers
      llm:
        provider: ollama
        model: ${OLLAMA_MODEL:-gpt-oss:latest}
        maxIterations: 50
        baseURL: ${OLLAMA_BASE_URL:-http://192.168.1.204:11434}

      embedding:
        disabled: false
        type: ollama
        model: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
        baseUrl: ${OLLAMA_BASE_URL:-http://192.168.1.204:11434}

      systemPrompt:
        enabled: true
        content: |
          You are an AI programming assistant focused on coding and reasoning tasks. You excel at:
          - Writing clean, efficient code
          - Debugging and problem-solving
          - Code review and optimization
          - Explaining complex technical concepts
          - Reasoning through programming challenges
